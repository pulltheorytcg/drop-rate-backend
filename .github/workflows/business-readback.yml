name: Business production readback
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/business-readback.yml', 'scripts/business_readback.py', 'tests/test_business_readback.py']
  push:
    branches: [main]
    paths:
      - 'backend/app/static/founder-accounts.js'
      - 'backend/app/static/business-area.css'
      - 'backend/app/static/workspace-shell.js'
      - 'backend/app/access_control.py'
      - 'backend/app/founder_accounts.py'
      - 'backend/app/main.py'
      - '.github/workflows/business-readback.yml'
      - 'scripts/business_readback.py'
      - 'tests/test_business_readback.py'
permissions:
  contents: read
jobs:
  read-only-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test release-check positive and negative contracts
        run: python -m unittest discover -s tests -p 'test_business_readback.py' -v
      - name: Verify exact public assets, shared entry, readiness and anonymous API denial
        run: python scripts/business_readback.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-production-readback
          path: business-readback.json
