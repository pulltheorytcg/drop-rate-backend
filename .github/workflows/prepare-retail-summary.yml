name: Prepare recommendation summary source
on:
  push:
    branches: [fix/automatic-retail-summary-20261012]
    paths: ['.github/workflows/prepare-retail-summary.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'pulltheorytcg/drop-rate-backend' && github.ref == 'refs/heads/fix/automatic-retail-summary-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply guarded app patch and remove temporary preparation script
        run: |
          python tools/prepare_retail_summary.py
          python -m compileall -q backend tests/test_recommendation_summary.py tests/recommendation_summary_postgres.py tests/ui/recommendation-summary.py
          find backend/app/static -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check
          rm tools/prepare_retail_summary.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Propagate eligible automatic retail recommendations without changing asking prices'
          git push origin HEAD:refs/heads/fix/automatic-retail-summary-20261012
