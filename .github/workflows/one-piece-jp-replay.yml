name: Japanese One Piece official/Cardmarket read-only match replay
on:
  push:
    branches: [fix/japanese-one-piece-cardmarket-coverage-20261013]
    paths: [.github/workflows/one-piece-jp-replay.yml]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project test dependencies
        run: python -m pip install -r requirements-dev.txt -q
      - name: Replay full official Japanese/English base printings against official current public download
        run: |
          PYTHONPATH=backend python - <<'PY'
          import collections,json,urllib.request
          from decimal import Decimal
          from datetime import datetime,timezone
          from pathlib import Path
          from types import SimpleNamespace
          from app.one_piece_japanese_market import matched_japanese_products, japanese_nonenglish_quote

          refs=json.loads(Path('.github/jp-onepiece-market-replay-fixture.json').read_text())
          base='https://downloads.s3.cardmarket.com/productCatalog/'
          export={}
          for name,path in {
              'singles':'productList/products_singles_18.json',
              'packaging':'productList/products_nonsingles_18.json',
              'prices':'priceGuide/price_guide_18.json',
          }.items():
              req=urllib.request.Request(base+path,headers={'User-Agent':'DropRate-Reference-Audit/1.0'})
              with urllib.request.urlopen(req,timeout=40) as response:
                  payload=response.read(32000001)
              if len(payload)>32000000:
                  raise ValueError('Oversized public source data')
              raw=json.loads(payload)
              if not isinstance(raw,dict) or 'createdAt' not in raw:
                  raise ValueError('Invalid source export')
              key='products' if name!='prices' else 'priceGuides'
              export[name]={str(row['idProduct']):row for row in raw[key]}
              print('SOURCE',name,'rows',len(export[name]),'timestamp',raw['createdAt'])
          matches=matched_japanese_products(refs,export['singles'],export['packaging'])
          jp={ref['provider_id']:ref for ref in refs if ref['language']=='Japanese'}
          fx=SimpleNamespace(rate=Decimal('.84763'),source='ECB_EURO_REFERENCE_RATES',
              effective_at=datetime(2026,10,12,tzinfo=timezone.utc),
              retrieved_at=datetime(2026,10,12,tzinfo=timezone.utc))
          now=datetime(2026,10,12,tzinfo=timezone.utc)
          quotes={}
          for k,match in matches.items():
              product=match['product']
              quote=japanese_nonenglish_quote(jp[k],match,
                  export['prices'].get(str(product['idProduct'])),now,fx)
              if quote:quotes[k]=quote
          by_release=collections.Counter((k.split('-',1)[0] for k in quotes))
          print('REPLAY_RESULT',json.dumps({
              'all_public_reference_rows':len(refs),
              'japanese_base_candidates':len(jp),
              'strict_market_matches':len(matches),
              'positive_quote_matches':len(quotes),
              'per_set':dict(sorted(by_release.items())),
              'examples':[(key,quotes[key]['product_id'],quotes[key]['price_gbp_minor'],
                         quotes[key]['marketplace_region_label'])
                         for key in list(sorted(quotes))[:20]],
          },sort_keys=True))
          assert len(jp)>=2000, 'Official Japanese source baseline changed'
          assert len(quotes)>=100, 'Expected substantial independently matched JP feed evidence'
          assert all(q['valuation_role']=='MIXED_NON_ENGLISH_REFERENCE'
                     and q['reference_language']=='Japanese'
                     and not q['physical_language_confirmed']
                     and not q['physical_valuation_eligible'] for q in quotes.values())
          assert len(quotes)==len(set(q['product_id'] for q in quotes.values())), 'Accidental many-to-one marketplace price merge'
          PY
