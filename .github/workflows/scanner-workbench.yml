name: Scanner regression workbench
on:
  push:
    branches: [fix/scanner-video-regressions-20261012]
    paths: [.github/workflows/scanner-workbench.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/scanner-video-regressions-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/scanner-video-regressions-20261012
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify patch checksum and apply only the reviewed files
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          data=''.join(Path(f'.github/scanner-patch-{i}.txt').read_text().strip() for i in (1,2,3))
          patch=gzip.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='ffc14517e74e0ca50dc3441c4cfa11c67939dc00be8c8036026c49ed72fae7c4'
          allowed={'BUILD_STATUS.md','backend/app/catalogue_browser.py','backend/app/grading_certificates.py','backend/app/slab_evidence.py','backend/app/static/index.html','backend/app/static/owner-recognition.js','backend/app/static/owner.html','backend/app/static/scanner-flow.css','backend/app/static/scanner-flow.js','docs/SCANNER_VIDEO_REGRESSIONS_20261012.md','tests/test_catalogue_browser.py','tests/test_scanner_video_regressions.py','tests/ui/scanner-flow.cjs'}
          paths={line.split(' b/',1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')}
          assert paths==allowed,(paths,allowed)
          Path('/tmp/scanner.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/scanner.patch'],check=True)
          subprocess.run(['git','apply','/tmp/scanner.patch'],check=True)
          def replace(path,old,new,count):
            p=Path(path);s=p.read_text();assert s.count(old)==count,(path,old,s.count(old));p.write_text(s.replace(old,new))
          replace('tests/test_scanner_video_regressions.py','Image.new("RGB", (64,64))','Image.new("RGB", (512,512))',1)
          replace('tests/test_owner_portal_shell.py','owner-recognition.js?v=owner-v13','owner-recognition.js?v=video-fix-v9',2)
          replace('tests/test_owner_portal_shell.py','scanner-flow.js?v=collection-v8','scanner-flow.js?v=video-fix-v9',1)
          replace('backend/app/main.py','scanner-flow.js?v=collection-v8','scanner-flow.js?v=video-fix-v9',1)
          replace('tests/ui/scanner-flow.cjs',"details.querySelector('input'); quantity", "details.querySelector('[aria-label=\"Quantity\"]'); quantity",1)
          PY
      - name: Install existing pinned test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --prefix tests/ui
      - name: Backend and JavaScript syntax
        run: |
          python -m compileall -q backend
          find backend/app/static -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Full backend regressions
        run: PYTHONPATH=backend pytest
      - name: Full dashboard regressions
        run: npm test --prefix tests/ui
      - name: Commit verified app source only to repair branch
        run: |
          git diff --check
          git add BUILD_STATUS.md backend/app/catalogue_browser.py backend/app/grading_certificates.py backend/app/slab_evidence.py backend/app/main.py backend/app/static/index.html backend/app/static/owner-recognition.js backend/app/static/owner.html backend/app/static/scanner-flow.css backend/app/static/scanner-flow.js docs/SCANNER_VIDEO_REGRESSIONS_20261012.md tests/test_catalogue_browser.py tests/test_scanner_video_regressions.py tests/test_owner_portal_shell.py tests/ui/scanner-flow.cjs
          git -c user.name='Drop Rate regression workbench' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: reject conflicting slab matches and repair scanner capture, grade and artwork recovery'
          git push origin HEAD:refs/heads/fix/scanner-video-regressions-20261012
