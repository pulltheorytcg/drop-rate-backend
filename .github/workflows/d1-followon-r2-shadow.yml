name: Complete remaining R2-first catalogue in staged D1 (quota-safe)

on:
  pull_request:
    paths:
      - 'backend/app/d1_r2_shadow_export.py'
      - 'tools/d1_r2_real_shadow.py'
      - 'tools/d1_followon_r2_shadow.py'
      - 'tests/test_d1_followon_r2_shadow.py'
      - 'tests/test_d1_r2_shadow_export.py'
      - '.github/workflows/d1-followon-r2-shadow.yml'
  push:
    branches: ['main']
    paths:
      - 'backend/app/d1_r2_shadow_export.py'
      - 'tools/d1_followon_r2_shadow.py'
      - '.github/workflows/d1-followon-r2-shadow.yml'
  schedule:
    - cron: '49 3 * * *'

permissions:
  contents: read

concurrency:
  group: full-catalogue-followon-r2-d1-one-writer
  cancel-in-progress: false

jobs:
  offline-source-and-ledger-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check complete four-source queue, D1 limits, OIDC and backwards parity
        env:
          PYTHONPATH: 'backend:tools'
        run: |
          python -m pytest -q \
            tests/test_d1_followon_r2_shadow.py \
            tests/test_d1_yugioh_shadow.py \
            tests/test_d1_r2_shadow_export.py

  private-resumable-migration:
    # Across all three source-specific workflows, exactly ONE cloud catalogue
    # writer may hold the D1 account reservation at any given instant.
    concurrency:
      group: drop-rate-d1-catalogue-private-single-writer
      cancel-in-progress: false
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule')
      && github.ref == 'refs/heads/main'
      # Explicit one-run release gate: an unrelated docs/source update must
      # never start D1 writes, even if all predecessor catalogues finish.
      && vars.DR_D1_FOLLOWON_IMPORT_APPROVED_SHA == github.sha
      && vars.DR_D1_FOLLOWON_IMPORT_APPROVED_RUN_ID == github.run_id
    needs: offline-source-and-ledger-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Stage up to 8,000 independently SHA-verified R2-first rows in private D1
        id: source
        env:
          PYTHONPATH: 'backend:tools'
          CLOUDFLARE_ACCOUNT_ID: e4d4b363540e991048d2e1812d5ef53e
          CLOUDFARE_D1_PILOT_TOKEN: ${{ secrets.CLOUDFARE_D1_PILOT_TOKEN }}
        run: python tools/d1_followon_r2_shadow.py
      - name: Post truthful full-source parity progress status
        if: always()
        env:
          GITHUB_STATUS_TOKEN: ${{ github.token }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          state="failure"
          description="R2 follow-on D1 import safely blocked; live catalogue unaffected"
          file=Path("d1-followon-r2-shadow-report.json")
          if file.exists() and os.environ["SOURCE_OUTCOME"]=="success":
              doc=json.loads(file.read_text())
              if (doc.get("production_reads_switched") is False
                  and doc.get("owner_and_settlement_writes")==0
                  and doc.get("market_value_writes")==0):
                  status=doc.get("status")
                  if (status=="ALL_FOLLOWON_R2_FIRST_SOURCES_VERIFIED"
                      and doc.get("verified_d1_rows")==155505):
                      state="success"
                      description="155,505 remaining R2-first references fully verified in D1"
                  elif status=="FOLLOWON_WAITING_FOR_YUGIOH_OR_DAILY_WINDOW":
                      rows=doc.get("yugioh_staged_rows")
                      expected=doc.get("yugioh_source_rows")
                      if (type(expected) is int and 45418<=expected<=50000
                          and type(rows) is int and 0<=rows<=expected):
                          state="pending"
                          description=f"Waiting for full YGO D1 parity ({rows}/{expected})"
                  elif status in (
                      "FOLLOWON_R2_PARTITION_PARTIAL_STAGED",
                      "FOLLOWON_R2_PARTITION_FULLY_VERIFIED"):
                      count=doc.get("d1_staged_rows")
                      src=doc.get("source")
                      if type(count) is int and src in {
                          "sports","sports-heritage","figures","magic"}:
                          state="pending"
                          description=f"{src} staging verified: {count} rows; overall pending"
          payload=json.dumps({
              "state":state,"context":"drop-rate-d1-followon-catalogue-parity",
              "description":description,
          }).encode()
          req=urllib.request.Request(
              "https://api.github.com/repos/"+os.environ["STATUS_REPO"]
              +"/statuses/"+os.environ["STATUS_SHA"],
              data=payload,method="POST",headers={
                  "Authorization":"Bearer "+os.environ["GITHUB_STATUS_TOKEN"],
                  "Content-Type":"application/json",
                  "Accept":"application/vnd.github+json",
              })
          with urllib.request.urlopen(req,timeout=20) as response:
              if response.status!=201:
                  raise SystemExit("Follow-on catalogue parity status not posted")
          print("Full-catalogue R2-first D1 parity status: "+state)
          PY
      - name: Retain private-safe progress and checksum report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-full-followon-r2-source-proof
          path: d1-followon-r2-shadow-report.json
          if-no-files-found: ignore
          retention-days: 30
