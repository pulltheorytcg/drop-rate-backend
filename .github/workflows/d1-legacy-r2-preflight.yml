name: Legacy R2 full source audit (cards, comics, manga, sealed)

on:
  pull_request:
    paths:
      - 'backend/app/d1_r2_shadow_export.py'
      - 'tools/d1_legacy_r2_preflight.py'
      - 'tools/d1_r2_real_shadow.py'
      - 'tests/test_d1_legacy_r2_preflight.py'
      - 'tests/test_d1_r2_shadow_export.py'
      - '.github/workflows/d1-legacy-r2-preflight.yml'
  push:
    branches: ['main']
    paths:
      - 'backend/app/d1_r2_shadow_export.py'
      - 'tools/d1_legacy_r2_preflight.py'
      - 'tools/d1_r2_real_shadow.py'
      - '.github/workflows/d1-legacy-r2-preflight.yml'

permissions:
  contents: read

concurrency:
  group: legacy-r2-source-preflight
  cancel-in-progress: false

jobs:
  offline-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify fixed R2 legacy relations and reject untrusted identities
        env:
          PYTHONPATH: 'backend:tools'
        run: |
          python -m pytest -q \
            tests/test_d1_legacy_r2_preflight.py \
            tests/test_d1_r2_shadow_export.py \
            tests/test_d1_magic_r2_preflight.py

  full-source-audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Audit immutable R2 legacy cards, sealed, comics and manga (no D1)
        id: source_proof
        env:
          PYTHONPATH: 'backend:tools'
        run: python tools/d1_legacy_r2_preflight.py
      - name: Publish status only when complete source evidence exists
        if: always()
        env:
          GITHUB_STATUS_TOKEN: ${{ github.token }}
          SOURCE_OUTCOME: ${{ steps.source_proof.outcome }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          state="failure"
          description="Legacy R2 source integrity blocked; no D1 cutover"
          if os.environ["SOURCE_OUTCOME"]=="success":
              path=Path("d1-legacy-r2-source-preflight-report.json")
              if path.is_file():
                  data=json.loads(path.read_text())
                  counts={"reference_cards":69697,"reference_sets":1472,
                          "reference_sealed_products":3893,
                          "catalogue_products":2062,
                          "catalogue_product_profiles":2062}
                  got=data.get("verified_relations")
                  verified=(isinstance(got,dict)
                            and {k:v.get("rows") for k,v in got.items()}==counts)
                  if (data.get("status")=="LEGACY_R2_SOURCE_PREPARED_FOR_D1"
                      and verified and data.get("source_rows_verified")==79186
                      and data.get("r2_parts_verified")==161
                      and data.get("d1_writes")==0
                      and data.get("owner_and_settlement_writes")==0
                      and data.get("market_value_writes")==0
                      and data.get("production_reads_switched") is False):
                      state="success"
                      description="Legacy 79,186 R2 source rows verified; NO D1 cutover"
          payload=json.dumps({
             "state":state,"context":"drop-rate-legacy-r2-source-parity",
             "description":description,
          }).encode()
          request=urllib.request.Request(
             "https://api.github.com/repos/"+os.environ["SOURCE_REPOSITORY"]
             +"/statuses/"+os.environ["SOURCE_COMMIT"],
             data=payload,method="POST",headers={
                "Authorization":"Bearer "+os.environ["GITHUB_STATUS_TOKEN"],
                "Content-Type":"application/json",
                "Accept":"application/vnd.github+json",
             })
          with urllib.request.urlopen(request,timeout=20) as response:
              if response.status!=201:
                  raise SystemExit("Legacy source status could not be reported")
          print("Legacy source audit status: "+state)
          PY
      - name: Retain private-safe source counts and SHA256 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-r2-full-source-proof
          path: d1-legacy-r2-source-preflight-report.json
          if-no-files-found: ignore
          retention-days: 30
