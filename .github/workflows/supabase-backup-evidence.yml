name: Verify Supabase Pro backup inventory (read-only)

# Run once on initial reviewed merge to main, then manually on demand.
# This verifies backups without changing the database or R2.
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/supabase-backup-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-supabase-backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify completed production backup timestamp without changing data
        id: verify
        env:
          # Requires a management API token with backups_read permission.
          # Never echo or upload this value.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python tools/supabase_backup_inventory.py
      - name: Publish sanitised backup result to GitHub commit status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          CHECK_OUTCOME: ${{ steps.verify.outcome }}
          LATEST_BACKUP: ${{ steps.verify.outputs.latest_completed_backup_at }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          state = "success" if os.environ["CHECK_OUTCOME"] == "success" else "failure"
          timestamp = os.environ.get("LATEST_BACKUP", "")
          # Sanitize description: a timestamp, not an upstream body or secret.
          safe = timestamp if len(timestamp) <= 35 and all(c.isdigit() or c in "TZ:+-." for c in timestamp) else ""
          desc = ("Verified completed backup " + safe) if state == "success" and safe else (
              "No recent completed backup verified; do not enable catalogue refresh"
          )
          req = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["GH_REPOSITORY"] +
              "/statuses/" + os.environ["GH_SHA"],
              data=json.dumps({"state":state,"context":"drop-rate-supabase-pro-backup",
                               "description":desc[:140],
                               "target_url":"https://github.com/" + os.environ["GH_REPOSITORY"] +
                                            "/actions/runs/" + os.environ["GITHUB_RUN_ID"]}).encode(),
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Accept":"application/vnd.github+json",
                       "Content-Type":"application/json",
                       "X-GitHub-Api-Version":"2022-11-28"},
              method="POST")
          with urllib.request.urlopen(req, timeout=10) as response:
              if response.status != 201:
                  raise RuntimeError("Could not publish backup evidence")
          PY
