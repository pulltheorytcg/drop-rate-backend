name: Lossless R2 reference quote source backup

on:
  pull_request:
    paths:
      - 'backend/app/reference_quote_source_backup.py'
      - 'backend/scripts/backup_reference_quote_sources.py'
      - 'backend/app/object_storage.py'
      - 'backend/app/access_control.py'
      - 'tests/test_reference_quote_source_backup.py'
      - 'tests/reference_quote_source_r2_postgres.py'
      - '.github/workflows/reference-quote-source-r2-backup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quote-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-quote-only
          POSTGRES_DB: reference_quotes_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d reference_quotes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - name: Validate bounded quotes, digests, typed restore and refusal paths
        run: PYTHONPATH=backend python -m pytest -q tests/test_reference_quote_source_backup.py
      - name: PostgreSQL 17 exact RLS and full-field price backup proof
        run: PYTHONPATH=backend python tests/reference_quote_source_r2_postgres.py
        env:
          REFERENCE_QUOTES_TEST_DSN: postgresql://postgres:disposable-quote-only@127.0.0.1:5432/reference_quotes_test
