name: iPhone app checks
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Choose an available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          echo "IOS_DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: Build and test native app
        run: xcodebuild -project ios/DropRate.xcodeproj -scheme DropRate -destination "platform=iOS Simulator,id=$IOS_DEVICE" -resultBundlePath ios-results.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-test-results
          path: ios-results.xcresult
