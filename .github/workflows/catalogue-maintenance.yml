name: Catalogue maintenance persistence
on:
  pull_request:
    paths:
      - 'backend/app/catalogue_maintenance.py'
      - 'backend/app/reference_sealed.py'
      - 'backend/app/catalogue_browser.py'
      - 'database/migrations/*catalogue_daily_maintenance.sql'
      - 'tests/*catalogue_maintenance*'
      - '.github/workflows/catalogue-maintenance.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: catalogue_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - run: PYTHONPATH=backend python tests/catalogue_maintenance_postgres.py
        env:
          CATALOGUE_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/catalogue_test
