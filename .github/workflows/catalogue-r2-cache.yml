name: R2 catalogue input cache parity
on:
  pull_request:
    paths:
      - 'backend/app/catalogue_r2_cache.py'
      - 'backend/app/catalogue_browser.py'
      - 'backend/app/catalogue_display_prices.py'
      - 'backend/app/catalogue_price_history.py'
      - 'backend/app/object_storage.py'
      - 'backend/app/db.py'
      - 'tests/*catalogue_r2_cache*'
      - 'tests/shared_reference_fixture.py'
      - '.github/workflows/catalogue-r2-cache.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: catalogue_r2_cache_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - run: PYTHONPATH=backend python tests/catalogue_r2_cache_postgres.py
        env:
          CATALOGUE_R2_CACHE_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/catalogue_r2_cache_test
