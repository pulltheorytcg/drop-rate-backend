name: Founder import preview rebuild
on:
  pull_request:
    paths:
      - 'backend/app/imports.py'
      - 'backend/app/import_preview_rebuild.py'
      - 'backend/app/import_review.py'
      - 'backend/app/import_inventory.py'
      - 'backend/app/import_admission.py'
      - 'backend/app/collectr_snapshot.py'
      - 'backend/app/ownership.py'
      - 'backend/app/settings.py'
      - 'backend/app/main.py'
      - 'database/migrations/*founder_import_preview_rebuild.sql'
      - 'tests/*import_preview_rebuild*'
      - 'tests/owner_auto_import_postgres.py'
      - '.github/workflows/import-preview-rebuild.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: import_preview_rebuild_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - run: >-
          PYTHONPATH=backend python -m pytest -q
          tests/test_import_preview_rebuild.py tests/test_import_framework.py
          tests/test_import_review.py tests/test_owner_csv_imports.py
          tests/test_import_physical_condition.py tests/test_import_physical_review.py
      - run: PYTHONPATH=backend python tests/import_preview_rebuild_postgres.py
        env:
          IMPORT_REBUILD_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/import_preview_rebuild_test
