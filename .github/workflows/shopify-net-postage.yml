name: Shopify net postage accounting PostgreSQL safety
on:
  pull_request:
    paths:
      - 'backend/app/shopify_pipeline.py'
      - 'backend/app/shopify_net_postage_policy.py'
      - 'backend/app/finance.py'
      - 'backend/app/owner_fulfillment.py'
      - 'database/migrations/*shopify_net_shipping_accounts.sql'
      - 'tests/test_shopify_owner_net_postage_policy.py'
      - 'tests/test_shopify_auto_shipping_finance.py'
      - 'tests/shopify_net_shipping_postgres.py'
      - '.github/workflows/shopify-net-postage.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: shopify_net_postage_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - run: PYTHONPATH=backend python tests/shopify_net_shipping_postgres.py
        env:
          SHOPIFY_NET_SHIPPING_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/shopify_net_postage_test
