name: R2 history archive persistence
on:
  pull_request:
    paths:
      - 'backend/app/reference_history_archive.py'
      - 'backend/app/object_storage.py'
      - 'backend/app/catalogue_maintenance.py'
      - 'database/pending/reference_history_r2_archive.sql'
      - 'database/migrations/*reference_history_r2_archive.sql'
      - 'tests/*reference_history*'
      - '.github/workflows/reference-history-r2.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: history_r2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - run: PYTHONPATH=backend python tests/reference_history_r2_postgres.py
        env:
          HISTORY_R2_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/history_r2_test

