name: Prepare shared inventory images
on:
  push:
    branches: ['fix/shared-inventory-image-delivery-20261011']
    paths: ['.github/workflows/prepare-shared-images.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-media-only
          POSTGRES_DB: media_test
          PGUSER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          python tools/prepare_shared_images.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_owner_portal_shell.py');s=p.read_text();assert s.count('owner-inventory.js?v=7')==1;p.write_text(s.replace('owner-inventory.js?v=7','owner-inventory.js?v=shared-art-v8'))
          p=Path('backend/app/static/owner-inventory.js');s=p.read_text();a=s.index('  function image(item, cls) {');b=s.index('\n  function close(',a);block=s[a:b]
          block=block.replace('    const owner = account(), attempts = [];','    const owner = account(), attempts = [];\n    const inventoryId = item.inventory_id || item.id;')
          block=block.replace('item.id || ""','inventoryId || ""').replace('${item.id}','${inventoryId}')
          p.write_text(s[:a]+block+s[b:])
          p=Path('tests/ui/shared-inventory-images.py');s=p.read_text();s=s.replace("'provider','missing_metadata'","'provider','inventory_alias','missing_metadata'")
          s=s.replace("                    if mode=='missing_metadata':item.pop('image_url')","                    if mode=='inventory_alias':item['inventory_id']=item.pop('id')\n                    if mode=='missing_metadata':item.pop('image_url')")
          p.write_text(s)
          p=Path('tests/shared_inventory_media_postgres.py');s=p.read_text();before='        app=FastAPI();app.state.db_pool=pool;app.include_router(api.router)';assert s.count(before)==1
          s=s.replace(before,before+'\n        @app.middleware("http")\n        async def request_context(request, call_next):\n            request.state.request_id="synthetic-media-http"\n            return await call_next(request)')
          p.write_text(s)
          PY
          git diff --check
      - run: python -m pip install --quiet -r requirements-dev.txt
      - run: PYTHONPATH=backend pytest
      - run: npm ci --prefix tests/ui --silent && npm test --prefix tests/ui
      - name: Restricted PostgreSQL media migration and authenticated image handler
        run: PYTHONPATH=backend python tests/shared_inventory_media_postgres.py
        env:
          MEDIA_TEST_DSN: postgresql://postgres:disposable-media-only@127.0.0.1:5432/media_test
      - name: Commit only tested patches if branch is unchanged
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/shared-inventory-image-delivery-20261011 | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import subprocess
          expected={'backend/app/api.py','backend/app/static/owner-inventory.js','backend/app/static/owner.html','tests/ui/owner-inventory.cjs','tests/ui/owner-inventory-browser.cjs','tests/test_owner_portal_shell.py','tests/ui/shared-inventory-images.py','tests/shared_inventory_media_postgres.py','BUILD_STATUS.md'}
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/api.py backend/app/static/owner-inventory.js backend/app/static/owner.html tests/ui/owner-inventory.cjs tests/ui/owner-inventory-browser.cjs tests/test_owner_portal_shell.py tests/ui/shared-inventory-images.py tests/shared_inventory_media_postgres.py BUILD_STATUS.md
          git commit -m 'Share approved catalogue artwork through the existing owned-item image route'
          git push origin HEAD:refs/heads/fix/shared-inventory-image-delivery-20261011
