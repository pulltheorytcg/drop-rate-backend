name: Cardmarket public feed compatibility (read only)

on:
  pull_request:
    paths:
      - backend/app/cardmarket_bulk_feed_audit.py
      - backend/scripts/audit_cardmarket_bulk_feed.py
      - backend/app/cardmarket_bulk_crosswalk.py
      - backend/scripts/pilot_cardmarket_live_crosswalk.py
      - tests/fixtures/cardmarket_fusion_strike_source_links_20261114.json
      - .github/workflows/cardmarket-public-feeds.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-bulk-by-game:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: pokemon
            canary: tests/fixtures/cardmarket_fusion_strike_source_links_20261114.json
          - game: magic
            canary: ''
          - game: yugioh
            canary: ''
          - game: one_piece
            canary: ''
          - game: lorcana
            canary: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned project dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Read-only official singles catalogue and guide audit
        env:
          PYTHONPATH: backend
          GAME: ${{ matrix.game }}
          CANARY: ${{ matrix.canary }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$CANARY" ]; then
            python backend/scripts/audit_cardmarket_bulk_feed.py --game "$GAME" --kind singles --read-only --canary-file "$CANARY"
          else
            python backend/scripts/audit_cardmarket_bulk_feed.py --game "$GAME" --kind singles --read-only
          fi

  magic-existing-mtgjson-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned project dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Verify existing Foundations exact-ID MTGJSON/Cardmarket pilot
        env:
          PYTHONPATH: backend
        run: python backend/scripts/pilot_cardmarket_public_daily_mtg.py
