name: Prepare tested journey corrections
on:
  push:
    branches: [fix/journey-regressions-20261012]
    paths: ['.github/workflows/apply-journey-fixes.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'pulltheorytcg/drop-rate-backend' && github.ref == 'refs/heads/fix/journey-regressions-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Check baseline and apply source-only edits
        run: |
          git fetch --depth=1 origin b93a9d700b9b6ba20dbb29be8006ef2b16e89dce
          git diff --exit-code --diff-filter=MD b93a9d700b9b6ba20dbb29be8006ef2b16e89dce -- backend/app tests BUILD_STATUS.md
          python .qa-session-patch.py
          python .qa-import-patch.py
          python .qa-channel-patch.py
          python .qa-db-patch.py
          python -m compileall -q backend tests
          find backend/app/static -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check
          # This job may commit source only. Workflow edits/removal are reviewed
          # separately through the authorised connector; do not expand its token.
          git restore .github/workflows
          git add backend/app tests BUILD_STATUS.md docs/JOURNEY_REGRESSION_QA.md
          git rm .qa-session-patch.py .qa-import-patch.py .qa-channel-patch.py .qa-db-patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix isolated account and import races; reuse shared channel references'
          git push origin HEAD:refs/heads/fix/journey-regressions-20261012
