name: Asking price database contract

on:
  pull_request:
    paths:
      - '.github/workflows/asking-price-contract.yml'
      - 'database/proposals/reference_asking_prices.sql'
      - 'database/migrations/*_reference_asking_prices.sql'
      - 'tests/reference_asking_postgres.py'
      - 'backend/app/reference_asking*.py'
      - 'backend/scripts/reference_asking*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asking-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: asking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASKING_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/asking_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned PostgreSQL test driver
        run: python -m pip install asyncpg==0.30.0
      - name: Verify real SQL, RLS, history atomicity and concurrent daily budget
        run: python tests/reference_asking_postgres.py
