name: Reference artwork persistence
on:
  pull_request:
    paths:
      - 'backend/app/reference_artwork.py'
      - 'backend/app/reference_feeds.py'
      - 'backend/app/reference_library.py'
      - 'backend/scripts/repair_reference_artwork.py'
      - 'tests/*reference_artwork*'
      - '.github/workflows/reference-artwork.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: artwork_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - run: PYTHONPATH=backend python tests/reference_artwork_postgres.py
        env:
          ARTWORK_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/artwork_test
