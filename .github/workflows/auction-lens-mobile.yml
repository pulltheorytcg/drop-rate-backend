name: Auction Lens iPhone client checks

on:
  pull_request:
    paths:
      - "mobile/src/lib/auctionLensStream.ts"
      - "mobile/src/lib/auctionLensResolver.ts"
      - "mobile/tests/auction-lens-stream.test.ts"
      - "mobile/tests/auction-lens-resolver.test.ts"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - ".github/workflows/auction-lens-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-auction-lens:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked mobile dependencies
        run: npm ci --prefix mobile
      - name: Typecheck Expo client
        run: npm --prefix mobile run typecheck
      - name: Run Auction Lens frame tests
        run: npm --prefix mobile test -- auction-lens
