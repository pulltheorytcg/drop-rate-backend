name: Prepare Business feature branch
on:
  push:
    branches: ['feat/founder-business-area-20261011']
    paths: ['.github/workflows/business-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-business-only
          POSTGRES_DB: business_area_test
          PGUSER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/prepare_business_area.py && git diff --check
      - run: python -m pip install --quiet -r requirements-dev.txt
      - run: PYTHONPATH=backend pytest
      - run: npm ci --prefix tests/ui --silent && npm test --prefix tests/ui
      - name: Restricted PostgreSQL and signed JWT HTTP acceptance
        run: PYTHONPATH=backend python tests/business_area_postgres.py
        env:
          BUSINESS_TEST_DSN: postgresql://postgres:disposable-business-only@127.0.0.1:5432/business_area_test
      - name: Commit only the tested patches to the unchanged feature branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/founder-business-area-20261011 | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import subprocess
          allowed={'backend/app/access_control.py','backend/app/founder_accounts.py','backend/app/main.py','backend/app/static/workspace-shell.js','BUILD_STATUS.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==allowed, changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/access_control.py backend/app/founder_accounts.py backend/app/main.py backend/app/static/workspace-shell.js BUILD_STATUS.md
          git commit -m 'Wire verified-founder Business access, read-only account fields and navigation'
          git push origin HEAD:refs/heads/feat/founder-business-area-20261011
