name: Isolated regional catalogue context
on:
  pull_request:
    paths:
      - 'backend/app/regional_catalogue_prices.py'
      - 'backend/data/regional_price_display_permissions.json'
      - 'database/migrations/20261112120000_regional_catalogue_context.sql'
      - 'tests/test_regional_catalogue_prices.py'
      - 'tests/regional_context_postgres.py'
      - '.github/workflows/regional-catalogue-context.yml'
  push:
    branches: [main]
    paths:
      - 'backend/app/regional_catalogue_prices.py'
      - 'database/migrations/20261112120000_regional_catalogue_context.sql'
permissions:
  contents: read
jobs:
  regional-context-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-context-only
          POSTGRES_DB: regional_context_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q tests/test_reference_market.py tests/test_regional_catalogue_prices.py
      - name: Concurrent replica budget, isolated persistence, backoff and RLS on real PostgreSQL
        run: PYTHONPATH=backend python tests/regional_context_postgres.py
        env:
          REGIONAL_CONTEXT_TEST_DSN: postgresql://postgres:disposable-context-only@127.0.0.1:5432/regional_context_test
