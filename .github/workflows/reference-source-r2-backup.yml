name: Lossless R2 reference source backup

on:
  pull_request:
    paths:
      - 'backend/app/reference_source_backup.py'
      - 'backend/scripts/backup_reference_card_source.py'
      - 'backend/app/object_storage.py'
      - 'backend/app/access_control.py'
      - 'tests/reference_source_r2_postgres.py'
      - 'tests/test_reference_source_backup.py'
      - '.github/workflows/reference-source-r2-backup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-source-only
          POSTGRES_DB: reference_source_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d reference_source_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - name: Reject incomplete, duplicated, or corrupted source rows
        run: PYTHONPATH=backend python -m pytest -q tests/test_reference_source_backup.py
      - name: Native full-field backup and restricted actor restore test
        run: PYTHONPATH=backend python tests/reference_source_r2_postgres.py
        env:
          REFERENCE_SOURCE_TEST_DSN: postgresql://postgres:disposable-source-only@127.0.0.1:5432/reference_source_test
