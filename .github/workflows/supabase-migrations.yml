name: Supabase migration gate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview only or apply pending production migrations"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ozrxenrdladkooixutmm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Verify canonical migration layout
        run: |
          python -m pip install --requirement requirements-dev.txt
          PYTHONPATH=backend pytest -q tests/test_migration_layout.py

      - name: Fail closed if required secrets are missing
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD}" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Stage canonical migrations for Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase init
          rm -rf supabase/migrations
          mkdir -p supabase/migrations
          cp database/migrations/*.sql supabase/migrations/
          test -n "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"

      - name: Link production project
        run: supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Show local and remote migration history
        run: supabase migration list

      - name: Preview pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations
        if: ${{ inputs.mode == 'apply' }}
        run: supabase db push

      - name: Verify migration history after apply
        if: ${{ inputs.mode == 'apply' }}
        run: supabase migration list
