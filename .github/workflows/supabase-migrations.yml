name: Supabase migration gate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview only or apply pending production migrations"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ozrxenrdladkooixutmm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Verify canonical migration layout
        run: |
          python -m pip install --requirement requirements-dev.txt
          PYTHONPATH=backend pytest -q tests/test_migration_layout.py

      - name: Fail closed if required secrets are missing
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD}" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Stage canonical migrations against production history
        shell: bash
        run: |
          set -euo pipefail
          supabase init
          rm -rf supabase/migrations
          python scripts/stage_supabase_migrations.py supabase/migrations
          test -n "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"

      - name: Link production project
        run: supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      # GitHub-hosted runners are IPv4-only. Supabase's direct database endpoint
      # requires IPv6 unless the project has a paid IPv4 add-on, so use its
      # built-in IPv4 session pooler for migrations instead.
      - name: Prepare masked IPv4 session-pooler connection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import quote

          project_ref = os.environ["SUPABASE_PROJECT_ID"]
          password = os.environ["SUPABASE_DB_PASSWORD"]
          if "\\r" in password or "\\n" in password:
              raise SystemExit("Database password must not contain a newline")

          encoded_password = quote(password, safe="")
          db_url = (
              f"postgresql://postgres.{project_ref}:{encoded_password}"
              "@aws-0-eu-west-2.pooler.supabase.com:5432/postgres?sslmode=require"
          )
          # The transformed password and complete URL must never appear in logs.
          print(f"::add-mask::{encoded_password}", flush=True)
          print(f"::add-mask::{db_url}", flush=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SUPABASE_POOLER_URL={db_url}\\n")
          PY

      - name: Show local and remote migration history
        run: supabase migration list --db-url "${SUPABASE_POOLER_URL}"

      - name: Preview pending migrations
        run: supabase db push --dry-run --db-url "${SUPABASE_POOLER_URL}"

      - name: Apply pending migrations
        if: ${{ inputs.mode == 'apply' }}
        run: supabase db push --db-url "${SUPABASE_POOLER_URL}"

      - name: Verify migration history after apply
        if: ${{ inputs.mode == 'apply' }}
        run: supabase migration list --db-url "${SUPABASE_POOLER_URL}"
