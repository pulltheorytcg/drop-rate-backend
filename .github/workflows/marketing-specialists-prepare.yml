name: Prepare marketing specialist draft

on:
  push:
    branches: [feat/marketing-specialist-runtime-20261004]
    paths: [.github/workflows/marketing-specialists-prepare.yml]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'pulltheorytcg/drop-rate-backend' && github.ref == 'refs/heads/feat/marketing-specialist-runtime-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact feature-branch ancestry and clean checkout
        run: |
          git merge-base --is-ancestor 3d01fd1c78895a8b94fe077a64c690c09d1e179d HEAD
          test "$(git rev-parse origin/main)" = 21a02f3bd2c1b09aa94cc45ad12ec0a78dcbafe1
          test -z "$(git status --porcelain)"
          test -f CLAUDE.md
          test "$(git hash-object BUILD_STATUS.md)" = c181c4004cbe81629c9d3e604a7c9ecd2e9aaed7
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Generate canonical migration filename without accessing a database
        run: |
          mkdir -p /tmp/drop-rate-migration/supabase/migrations
          cd /tmp/drop-rate-migration
          npx --yes supabase@2.113.0 migration new --help
          npx --yes supabase@2.113.0 migration new marketing_specialists_v1
      - name: Prepare generated files and preserve build history
        run: |
          python automation/n8n/marketing/build_workflows.py
          python - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('.')
          source = root / 'backend/app/marketing_specialists.py'
          text = source.read_text()
          old = "if command.stage == 'design':\n            state = 'AWAITING_MEDIA'"
          assert text.count(old) == 1
          source.write_text(text.replace(old, "if command.stage == 'design' and not proposal.needs_review:\n            state = 'AWAITING_MEDIA'"))
          tests = root / 'tests/test_marketing_specialists.py'
          tests.write_text(tests.read_text() + '''\n\n@pytest.mark.asyncio\nasync def test_design_review_state_is_not_hidden_by_media_wait():\n    store, model = MemoryStore(), FakeModel()\n    for stage in ['research', 'brief', 'copywriting']:\n        await run_specialist(store, model, command(store, stage))\n    model.review = True\n    result = await run_specialist(store, model, command(store, 'design'))\n    assert result['state'] == 'NEEDS_REVIEW'\n    assert result['output']['review_reasons']\n''')
          generated = list(Path('/tmp/drop-rate-migration/supabase/migrations').glob('*_marketing_specialists_v1.sql'))
          assert len(generated) == 1
          draft = root / 'database/marketing_specialists_v1.sql'
          target = root / 'database/migrations' / generated[0].name
          assert not target.exists()
          target.write_text(draft.read_text().split('\n', 1)[1])
          draft.unlink()
          heading = '## 2026-10-04 — Marketing specialist runtime v1 (draft; not deployed)'
          status = root / 'BUILD_STATUS.md'
          original = status.read_bytes()
          assert heading.encode() not in original
          first, rest = original.split(b'\n', 1)
          entry = '\n' + heading + '\n\n' + (
              '- Added separate research, brief, copywriting, design, publishing and social-management roles with versioned prompts and bounded structured model calls. The publisher is hard-blocked and makes no provider writes.\n'
              '- Added signed internal backend commands and an additive actor-scoped PostgreSQL jobs/runs migration with RLS, immutable snapshots, unique stage claims and no automatic retry of unknown outcomes. No migration has been applied.\n'
              '- Exported six inactive child workflows and a preparation coordinator outside automatic provisioning. Existing production n8n data/startup are unchanged. Research uses supplied evidence, design produces layout instructions awaiting approved media, and management uses supplied metric snapshots.\n'
              '- Local first-pass evidence: 41 core Python tests and 15 actual Code-node checks passed using mocks; full CI and database/runtime verification remain separate release gates. No production deployment, live model call, Higgsfield request, Buffer post, new service or schedule was made.\n'
              '- Immediate shareNow remains the later approved pilot instruction. Media approval, real publisher and delivery reconciliation are still required. Details and rollback: docs/MARKETING_SPECIALISTS_V1.md.\n'
          )
          status.write_bytes(first + b'\n' + entry.encode() + rest)
          doc = root / 'docs/MARKETING_SPECIALISTS_V1.md'
          docs = doc.read_text().replace('Generate a canonical timestamped migration from the SQL draft before release.', 'Canonical migration generated by Supabase CLI: `' + str(target) + '`. It has not been applied.')
          docs = docs.replace('finish canonical migration generation and BUILD_STATUS entry; ', '')
          doc.write_text(docs)
          PY
      - name: Targeted checks
        run: |
          set -o pipefail
          PYTHONPATH=backend pytest -q tests/test_marketing_specialists.py tests/test_marketing_specialist_api.py | tee /tmp/marketing-targeted.txt
          node --test tests/marketing_workflows.test.cjs
          python -m compileall -q backend
          git diff --check
      - name: Full backend regression suite
        run: |
          set -o pipefail
          PYTHONPATH=backend pytest -q | tee /tmp/marketing-full.txt
      - name: Record evidence and push generated feature-branch files only
        run: |
          python - <<'PY'
          from pathlib import Path
          targeted = Path('/tmp/marketing-targeted.txt').read_text().strip().splitlines()[-1]
          full = Path('/tmp/marketing-full.txt').read_text().strip().splitlines()[-1]
          path = Path('docs/MARKETING_SPECIALISTS_V1.md')
          path.write_text(path.read_text() + '\n## GitHub preparation-run evidence\n\nTargeted: ' + targeted + '\n\nFull backend: ' + full + '\n\nNode Code-node tests: 15 passed. These are CI tests with mocks, not a production or model smoke test. Database application and n8n import/runtime remain unverified.\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BUILD_STATUS.md backend/app/marketing_specialists.py tests/test_marketing_specialists.py docs/MARKETING_SPECIALISTS_V1.md database/marketing_specialists_v1.sql database/migrations/*_marketing_specialists_v1.sql automation/n8n/marketing/workflows.json
          git diff --cached --check
          git commit -m 'Finish inactive specialist exports, canonical migration and verified draft status'
          git push origin HEAD:refs/heads/feat/marketing-specialist-runtime-20261004
