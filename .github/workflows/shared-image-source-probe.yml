name: Shared image source probe
on:
  push:
    branches: ['fix/shared-inventory-image-delivery-20261011']
    paths: ['.github/workflows/shared-image-source-probe.yml']
permissions:
  contents: read
jobs:
  read-public-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -r requirements-dev.txt
      - name: Three bounded GETs using actual transport; no database or user credentials
        run: |
          PYTHONPATH=backend python - <<'PY'
          import asyncio,hashlib,io,json
          from datetime import datetime,timezone
          from pathlib import Path
          from urllib.parse import urlsplit
          import httpx
          from PIL import Image
          from app.api import _fetch_inventory_image
          urls=[
            'https://www.onepiece-cardgame.com/images/cardlist/card/OP15-008.png?2602273',
            'https://cardtrader.com/uploads/blueprints/image/223158/borgos-feelings-bequeathed-dawn-of-the-z-legends.jpg',
            'https://cardtrader.com/uploads/blueprints/image/282466/son-gohan-son-gohan-rampage-premonition-beyond-generations.jpg'
          ]
          async def main():
            results=[]
            async with httpx.AsyncClient(timeout=httpx.Timeout(12,connect=5),follow_redirects=False,headers={'User-Agent':'DropRateInventory/1.0'}) as client:
              for url in urls:
                row={'host':urlsplit(url).hostname,'source_sha256':hashlib.sha256(url.encode()).hexdigest()}
                try:
                  result=await asyncio.wait_for(_fetch_inventory_image(client,url),35)
                  if result:
                    content,mime=result
                    with Image.open(io.BytesIO(content)) as img:
                      row.update(width=img.width,height=img.height,format=img.format);img.verify()
                    row.update(ok=True,bytes=len(content),content_type=mime)
                  else:row.update(ok=False,error='Transport/source unavailable')
                except Exception as exc:row.update(ok=False,error=type(exc).__name__)
                results.append(row)
            report={'checked_at':datetime.now(timezone.utc).isoformat(),'results':results,'note':'Actual public image bytes via shared transport. No production DB/authenticated seller request.'}
            Path('/tmp/shared-image-source.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
            assert all(r['ok'] for r in results), 'An assigned image source is unavailable'
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-image-source-result
          path: /tmp/shared-image-source.json
          retention-days: 7
