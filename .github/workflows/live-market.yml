name: Live market persistence
on:
  pull_request:
    paths:
      - 'backend/app/live_market_refresh.py'
      - 'backend/app/ebay_sold_pricing.py'
      - 'backend/app/inventory_intelligence.py'
      - 'database/migrations/*_current_ebay_reference_values.sql'
      - 'tests/*live_market*'
      - '.github/workflows/live-market.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: live_market_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - run: PYTHONPATH=backend python tests/live_market_postgres.py
        env:
          LIVE_MARKET_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/live_market_test
