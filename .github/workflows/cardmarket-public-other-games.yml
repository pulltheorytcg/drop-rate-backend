name: Read only Cardmarket public Yu-Gi-Oh Lorcana file discovery

on:
  pull_request:
    paths:
      - 'backend/app/cardmarket_public_feed_availability.py'
      - 'backend/scripts/pilot_cardmarket_public_other_games.py'
      - 'tests/test_cardmarket_public_feed_availability.py'
      - '.github/workflows/cardmarket-public-other-games.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardmarket-other-games-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-source-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements.txt
      - run: PYTHONPATH=backend python -m pytest -q tests/test_cardmarket_public_feed_availability.py
      - name: Read bounded official public files; output SHA and counts only
        run: timeout 210s env PYTHONPATH=backend python backend/scripts/pilot_cardmarket_public_other_games.py
