name: Align marketing release history
on:
  push:
    branches: [feat/marketing-specialist-runtime-20261004]
    paths: [.github/workflows/marketing-release-align.yml]
permissions:
  contents: write
jobs:
  align:
    if: github.repository == 'pulltheorytcg/drop-rate-backend' && github.ref == 'refs/heads/feat/marketing-specialist-runtime-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify branch and preserve existing work
        run: |
          git merge-base --is-ancestor 220679f4d107cf4ecf40efc51a0c646daf411eb9 HEAD
          test "$(git rev-parse origin/main)" = 21a02f3bd2c1b09aa94cc45ad12ec0a78dcbafe1
          test -z "$(git status --porcelain)"
      - name: Align canonical filename and append factual release status
        run: |
          python - <<'PY'
          from pathlib import Path
          old = Path('database/migrations/20261004051810_marketing_specialists_v1.sql')
          new = old.with_name('20261004133308_marketing_specialists_v1.sql')
          assert old.is_file() and not new.exists()
          old.rename(new)
          status = Path('BUILD_STATUS.md')
          first, rest = status.read_bytes().split(b'\n',1)
          entry = '\n## 2026-10-04 — Marketing preparation production migration applied\n\n- Applied only the reviewed additive marketing-specialist migration via Supabase; actual production version is `20261004133308`. Canonical filename is aligned with that recorded version without editing production migration history.\n- Read-back confirms both marketing tables exist with forced RLS, no anon/authenticated SELECT, no tcg_api DELETE or unrestricted UPDATE, and zero jobs/runs. Existing stock, ownership and financial tables were not modified.\n- Existing founder-auth functions and non-bypass tcg_api role were inspected. The connector cannot SET ROLE tcg_api, so an attempted rollback-only role test was rejected before writing; live actor/RLS validation remains for the authenticated backend probe. No permissions were broadened.\n- API/n8n deployment and real-model verification are the next gates. Daily scheduling and the unimplemented Buffer publisher remain off. See docs/MARKETING_SPECIALISTS_VALIDATION.md; retain historical checkpoints below.\n'
          assert entry.splitlines()[1].encode() not in rest
          status.write_bytes(first+b'\n'+entry.encode()+rest)
          for name in ['docs/MARKETING_SPECIALISTS_V1.md','docs/MARKETING_SPECIALISTS_VALIDATION.md']:
              p=Path(name)
              text=p.read_text().replace('database/migrations/20261004051810_marketing_specialists_v1.sql',str(new))
              text += '\n## Production migration checkpoint — 4 October 2026, 13:33 UTC\n\nThe reviewed migration is now applied as `20261004133308_marketing_specialists_v1`. Read-back verifies forced RLS and narrow grants; both new tables are empty. Earlier unapplied statements above are historical. Runtime deployment and an actual authenticated backend/model probe are still pending. A connector SET ROLE test was refused before any test insertion; do not claim it passed or broaden role membership to bypass it.\n'
              p.write_text(text)
          PY
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Run existing release checks without production credentials
        run: |
          PYTHONPATH=backend pytest
          node --test tests/marketing_workflows.test.cjs
          python -m compileall -q backend
          git diff --check
      - name: Commit only the canonical rename and documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/migrations/20261004051810_marketing_specialists_v1.sql database/migrations/20261004133308_marketing_specialists_v1.sql BUILD_STATUS.md docs/MARKETING_SPECIALISTS_V1.md docs/MARKETING_SPECIALISTS_VALIDATION.md
          git diff --cached --check
          git commit -m 'Record applied marketing migration and preserve canonical version alignment'
          git push origin HEAD:refs/heads/feat/marketing-specialist-runtime-20261004
