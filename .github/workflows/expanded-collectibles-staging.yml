name: Expanded collectibles staging

on:
  pull_request:
    paths:
      - 'database/migrations/20261101205040_collectible_catalogue_expansion.sql'
      - 'backend/app/collectible_source_adapters.py'
      - 'backend/app/reference_library.py'
      - 'tests/expanded_collectibles_postgres.py'
      - '.github/workflows/expanded-collectibles-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: expanded_collectibles_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d expanded_collectibles_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Check exact-match reference contracts
        run: PYTHONPATH=backend python -m pytest -q tests/test_collectible_expansion.py
      - name: Apply real migration and stage references in disposable PostgreSQL
        run: PYTHONPATH=backend python tests/expanded_collectibles_postgres.py
        env:
          EXPANDED_COLLECTIBLES_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/expanded_collectibles_test
