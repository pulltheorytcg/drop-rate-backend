name: Full catalogue D1 capacity and YGO parity read-only gate

on:
  pull_request:
    paths:
      - 'tools/d1_full_catalogue_capacity.py'
      - 'tests/test_d1_full_catalogue_capacity.py'
      - '.github/workflows/d1-full-catalogue-capacity.yml'
  push:
    branches: ['main']
    paths:
      - 'tools/d1_full_catalogue_capacity.py'
      - '.github/workflows/d1-full-catalogue-capacity.yml'
  schedule:
    - cron: '5 4 * * *'

permissions:
  contents: read

concurrency:
  group: d1-full-catalogue-capacity-readonly
  cancel-in-progress: false

jobs:
  verify-no-write-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate D1 account-only read queries and completion gates
        env:
          PYTHONPATH: 'backend:tools'
        run: python -m pytest -q tests/test_d1_full_catalogue_capacity.py

  inspect-real-cloudflare:
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule')
      && github.ref == 'refs/heads/main'
    needs: verify-no-write-contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Measure actual D1 database count and disk size without writes
        id: capacity
        env:
          PYTHONPATH: 'backend:tools'
          CLOUDFLARE_ACCOUNT_ID: e4d4b363540e991048d2e1812d5ef53e
          CLOUDFARE_D1_PILOT_TOKEN: ${{ secrets.CLOUDFARE_D1_PILOT_TOKEN }}
        run: python tools/d1_full_catalogue_capacity.py
      - name: Publish truthful catalogue readiness status only
        if: always()
        env:
          GITHUB_STATUS_TOKEN: ${{ github.token }}
          CAPACITY_OUTCOME: ${{ steps.capacity.outcome }}
          STATUS_COMMIT: ${{ github.sha }}
          STATUS_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          state="failure"
          description="D1 read-only capacity audit blocked"
          file=Path("d1-full-catalogue-capacity-report.json")
          if file.is_file() and os.environ["CAPACITY_OUTCOME"]=="success":
              d=json.loads(file.read_text())
              if (d.get("status")=="READ_ONLY_D1_ACCOUNT_INVENTORY_VERIFIED"
                  and d.get("d1_writes")==0 and d.get("market_value_writes")==0
                  and d.get("owner_or_settlement_writes")==0
                  and d.get("production_reads_switched") is False):
                  rows=d.get("yugioh_staged_rows")
                  if d.get("subsequent_import_allowed_by_static_readiness"):
                      state="success"
                      description="YGO D1 fully active; other DB capacity preflight passed"
                  elif type(rows) is int and 0 <= rows <= 45418:
                      state="pending"
                      description=f"YGO staged {rows}/45418; D1 migration gate not open"
          body=json.dumps({
              "state":state,"context":"drop-rate-full-catalogue-d1-capacity",
              "description":description,
          }).encode()
          req=urllib.request.Request(
              "https://api.github.com/repos/"+os.environ["STATUS_REPOSITORY"]
              +"/statuses/"+os.environ["STATUS_COMMIT"],
              data=body,method="POST",headers={
                  "Authorization":"Bearer "+os.environ["GITHUB_STATUS_TOKEN"],
                  "Content-Type":"application/json",
                  "Accept":"application/vnd.github+json",
              })
          with urllib.request.urlopen(req,timeout=20) as response:
              if response.status!=201:
                  raise SystemExit("Capacity status not published")
          print("Full-catalogue capacity read-only gate: "+state)
          PY
      - name: Keep private-safe count and disk usage proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-full-catalogue-capacity
          path: d1-full-catalogue-capacity-report.json
          if-no-files-found: ignore
          retention-days: 14
