name: D1 real Lorcana R2 shadow import

on:
  pull_request:
    paths:
      - 'backend/app/d1_r2_shadow_export.py'
      - 'backend/app/d1_shadow_catalogue.py'
      - 'backend/app/main.py'
      - 'tools/d1_r2_real_shadow.py'
      - 'tests/test_d1_r2_shadow_export.py'
      - 'tests/test_d1_r2_real_shadow.py'
      - '.github/workflows/d1-real-r2-to-d1.yml'
  push:
    branches: ['main']
    paths:
      - 'backend/app/d1_r2_shadow_export.py'
      - 'tools/d1_r2_real_shadow.py'
      - '.github/workflows/d1-real-r2-to-d1.yml'

permissions:
  contents: read

concurrency:
  group: d1-real-r2-lorcana-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-security-and-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact offline dependency versions
        run: python -m pip install -r requirements.txt
      - name: Verify signed workload, full R2 bytes, all D1 rows and rollback
        env:
          PYTHONPATH: 'backend:tools'
        run: |
          python -m pytest -q \
            tests/test_d1_r2_shadow_export.py \
            tests/test_d1_r2_real_shadow.py \
            tests/test_d1_shadow_catalogue.py \
            tests/test_d1_shadow_remote_probe.py

  real-lorcana-shadow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: isolated-security-and-parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Import verified published R2 Lorcana reference partition to NEW isolated D1
        env:
          CLOUDFLARE_ACCOUNT_ID: e4d4b363540e991048d2e1812d5ef53e
          CLOUDFARE_D1_PILOT_TOKEN: ${{ secrets.CLOUDFARE_D1_PILOT_TOKEN }}
          PYTHONPATH: 'backend:tools'
        run: python tools/d1_r2_real_shadow.py
      - name: Preserve source parity proof; no credentials or card details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-lorcana-real-shadow-parity
          path: d1-lorcana-real-shadow-report.json
          if-no-files-found: ignore
          retention-days: 30
