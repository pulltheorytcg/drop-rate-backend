name: Shopify sealed pooling order safety
on:
  pull_request:
    paths:
      - 'backend/app/shopify_pipeline.py'
      - 'backend/app/shopify_sealed_pooling.py'
      - 'database/migrations/*shopify_variant_pool_aliases.sql'
      - 'tests/test_shopify_sealed_pooling.py'
      - 'tests/shopify_sealed_pool_postgres.py'
      - '.github/workflows/shopify-sealed-pool.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: sealed_pool_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - run: PYTHONPATH=backend python tests/shopify_sealed_pool_postgres.py
        env:
          SEALED_POOL_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/sealed_pool_test
