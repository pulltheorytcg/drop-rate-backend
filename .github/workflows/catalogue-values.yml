name: Independent catalogue valuations
on:
  pull_request:
    paths:
      - 'backend/app/catalogue_valuations.py'
      - 'backend/app/catalogue_maintenance.py'
      - 'database/migrations/*independent_catalogue_valuations.sql'
      - 'database/migrations/*activate_catalogue_reference_values.sql'
      - 'tests/*catalogue_values*'
      - 'tests/*catalogue_valuations*'
      - '.github/workflows/catalogue-values.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: catalogue_values_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - run: PYTHONPATH=backend python tests/catalogue_values_postgres.py
        env:
          CATALOGUE_VALUES_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/catalogue_values_test
