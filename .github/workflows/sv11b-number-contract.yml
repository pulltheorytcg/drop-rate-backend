name: Reviewed catalogue number repair

on:
  pull_request:
    paths:
      - '.github/workflows/sv11b-number-contract.yml'
      - 'database/proposals/repair_sv11b*.sql'
      - 'tests/sv11b_number_postgres.py'
      - 'backend/app/reference_feeds.py'
      - 'tests/test_sv11b_number_reference.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sv11b-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: sv11b_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SV11B_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/sv11b_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned PostgreSQL test driver
        run: python -m pip install asyncpg==0.30.0
      - name: Verify identity guards, audit atomicity and rollback
        run: python tests/sv11b_number_postgres.py
