name: Real MTGJSON Magic R2 to D1 (sequenced quota-safe shadow)

on:
  pull_request:
    paths:
      - 'backend/app/d1_r2_shadow_export.py'
      - 'tools/d1_r2_real_shadow.py'
      - 'tools/d1_magic_shadow.py'
      - 'tests/test_d1_magic_shadow.py'
      - '.github/workflows/d1-magic-r2-shadow.yml'
  push:
    branches: ['main']
    paths:
      - 'backend/app/d1_r2_shadow_export.py'
      - 'tools/d1_r2_real_shadow.py'
      - 'tools/d1_magic_shadow.py'
      - '.github/workflows/d1-magic-r2-shadow.yml'
  # Only after the 03:17 Yu-Gi-Oh writer and 04:05 account capacity audit.
  # The Python run MUST prove YGO full active parity, source integrity and
  # no YGO writes today before it creates any Magic D1 shadow.
  schedule:
    - cron: '43 5 * * *'

permissions:
  contents: read

concurrency:
  group: d1-real-magic-shadow-single-writer
  cancel-in-progress: false

jobs:
  offline-identity-and-quota-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify original Magic IDs, Yu-Gi-Oh gate, fixed OIDC source and D1 readback
        env:
          PYTHONPATH: 'backend:tools'
        run: |
          python -m pytest -q \
            tests/test_d1_magic_shadow.py \
            tests/test_d1_magic_r2_preflight.py \
            tests/test_d1_r2_shadow_export.py

  sequential-real-magic-import:
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule')
      && github.ref == 'refs/heads/main'
    needs: offline-identity-and-quota-gates
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      id-token: write
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Stage maximum 5,000 verified Magic references ONLY after verified YGO completion
        id: real_import
        env:
          CLOUDFLARE_ACCOUNT_ID: e4d4b363540e991048d2e1812d5ef53e
          CLOUDFARE_D1_PILOT_TOKEN: ${{ secrets.CLOUDFARE_D1_PILOT_TOKEN }}
          PYTHONPATH: 'backend:tools'
        run: python tools/d1_magic_shadow.py
      - name: Report verified staged or blocked state, never claim full coverage early
        if: always()
        env:
          GITHUB_STATUS_TOKEN: ${{ github.token }}
          IMPORT_OUTCOME: ${{ steps.real_import.outcome }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          state="failure"
          description="Magic R2-D1 import blocked; no production cutover"
          if os.environ["IMPORT_OUTCOME"]=="success":
              f=Path("d1-magic-real-shadow-report.json")
              if f.is_file():
                  d=json.loads(f.read_text())
                  n=d.get("d1_verified_rows", d.get("d1_staged_rows"))
                  waiting={
                      "MAGIC_WAITING_FOR_YUGIOH_D1_PARITY",
                      "MAGIC_WAITING_FOR_YUGIOH_DAILY_BUDGET",
                      "MAGIC_WAITING_FOR_D1_DISK_HEADROOM",
                      "MAGIC_WAITING_FOR_D1_DATABASE_CAPACITY",
                      "MAGIC_D1_SHADOW_DAILY_BUDGET_ALREADY_USED",
                      "MAGIC_D1_SHADOW_PARTIAL_VERIFIED",
                  }
                  if (type(n) is int and 0<=n<=153662
                      and d.get("source_rows")==153662
                      and d.get("market_value_writes")==0
                      and d.get("owner_and_settlement_writes")==0
                      and d.get("no_public_catalogue_cutover") is True):
                      if (d.get("status")=="REAL_R2_MAGIC_TO_ISOLATED_D1_VERIFIED"
                          and d.get("d1_verified_rows")==153662):
                          state="success"
                          description="Full 153,662-row Magic D1 projection SHA256 parity"
                      elif d.get("status") in waiting:
                          state="pending"
                          description=f"Magic isolated staging: {n}/153662; source gate active"
          body=json.dumps({
              "state":state,"context":"drop-rate-d1-real-magic-parity",
              "description":description,
          }).encode()
          req=urllib.request.Request(
              "https://api.github.com/repos/"+os.environ["REPOSITORY"]
              +"/statuses/"+os.environ["COMMIT"],data=body,method="POST",
              headers={
                  "Authorization":"Bearer "+os.environ["GITHUB_STATUS_TOKEN"],
                  "Content-Type":"application/json",
                  "Accept":"application/vnd.github+json",
              })
          with urllib.request.urlopen(req,timeout=20) as response:
              if response.status!=201:
                  raise SystemExit("Magic D1 status not published")
          print("Magic D1 shadow status: "+state)
          PY
      - name: Preserve source and D1 parity report with no private fields
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magic-real-r2-d1-shadow-proof
          path: d1-magic-real-shadow-report.json
          if-no-files-found: ignore
          retention-days: 30
