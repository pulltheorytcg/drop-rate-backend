name: Adjust shared reference regression assertions
on:
  push:
    branches: [fix/shared-inventory-reference-consistency-20261012]
    paths: ['.github/workflows/adjust-reference-regressions.yml']
permissions:
  contents: write
jobs:
  adjust:
    if: github.repository == 'pulltheorytcg/drop-rate-backend' && github.ref == 'refs/heads/fix/shared-inventory-reference-consistency-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Assert unchanged tests, preserve history checks and add shared-pipeline assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def load(name,expected):
              path=Path(name);raw=path.read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==expected,name
              return path,raw.decode()
          path,text=load('tests/ui/workspace-navigation.cjs','1c6d527de846b9c39687e9483be4284193092ce6')
          old="[0,1,0,'Value pending','0 valued · 1 awaiting market data']"
          assert text.count(old)==1
          path.write_text(text.replace(old,"[0,1,0,'Value unavailable','0 valued · 1 awaiting market data']"))
          path,text=load('tests/live_market_postgres.py','f51ec93b1a0bd848b63e7e786babfa558b2f06af')
          old="        assert report['totals']['active_inventory_count']==1 and report['totals']['market_valued_item_count']==1\n"
          assert text.count(old)==1
          text=text.replace(old,"""        assert report['totals']['active_inventory_count']==1
                  # Current display must not borrow the owner-specific cache when
                  # this fixture has not yet produced shared catalogue evidence.
                  assert report['totals']['market_valued_item_count']==0
                  assert report['totals']['inventory_market_value_minor'] is None
                  assert report['totals']['valuation_basis']=='SHARED_CATALOGUE_V1'
          """.replace('                  ','        ').rstrip()+"\n")
          old="        assert await db.fetchval('select count(*) from tcg.catalogue_market_snapshots')==2\n"
          assert text.count(old)==1
          extra="""        # The real guide writer now supplies shared evidence. Verify the
                  # current view starts using it without changing either sale price.
                  report=await inventory_intelligence(request,user,top_limit=5,window_days=7)
                  assert report['totals']['market_valued_item_count']==1
                  assert report['totals']['inventory_market_value_minor']==170
                  assert report['totals']['guide_estimate_count']==1
                  assert await db.fetchval('select bool_and(store_price_minor=9000) from tcg.inventory_items')
          """.replace('                  ','        ').rstrip()+"\n"
          path.write_text(text.replace(old,old+extra))
          PY
          python -m compileall -q tests/live_market_postgres.py
          node --check tests/ui/workspace-navigation.cjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/live_market_postgres.py tests/ui/workspace-navigation.cjs
          git commit -m 'Prove current portfolio waits for shared evidence, then uses the real guide snapshot'
          git push origin HEAD:refs/heads/fix/shared-inventory-reference-consistency-20261012
