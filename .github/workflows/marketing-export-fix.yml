name: Repair marketing export draft

on:
  push:
    branches: [feat/marketing-specialist-runtime-20261004]
    paths: [.github/workflows/marketing-export-fix.yml]

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'pulltheorytcg/drop-rate-backend' && github.ref == 'refs/heads/feat/marketing-specialist-runtime-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify ancestry and repair only known draft exports
        run: |
          git merge-base --is-ancestor 56479ad97cb81434acbc11fc184f70049aec578b HEAD
          test "$(git rev-parse origin/main)" = 21a02f3bd2c1b09aa94cc45ad12ec0a78dcbafe1
          test -z "$(git status --porcelain)"
          python - <<'PY'
          from pathlib import Path
          path = Path('automation/n8n/marketing/build_workflows.py')
          text = path.read_text()
          old = "'sendBody': True, 'contentType': 'raw', 'rawContentType': 'application/json',\n            'body': '={{ $json.command_body }}'"
          new = "'sendBody': True, 'contentType': 'json', 'specifyBody': 'json',\n            'jsonBody': '={{ $json.command_body }}'"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          tests = Path('tests/marketing_workflows.test.cjs')
          tests.write_text(tests.read_text() + '''\ntest('JSON request mode preserves parsed JSON responses for signed handoffs',()=>{\n  for(const w of workflows.slice(0,6)){\n    const p=w.nodes.find(n=>n.type.endsWith('.httpRequest')).parameters;\n    assert.equal(p.contentType,'json');\n    assert.equal(p.specifyBody,'json');\n    assert.equal(p.jsonBody,'={{ $json.command_body }}');\n    assert.equal(p.body,undefined);\n    assert.equal(p.rawContentType,undefined);\n  }\n});\n''')
          PY
          python automation/n8n/marketing/build_workflows.py
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Execute signer and response contract checks
        run: |
          PYTHONPATH=backend pytest -o addopts='' -q tests/test_marketing_specialists.py tests/test_marketing_specialist_api.py
          node --test tests/marketing_workflows.test.cjs
          git diff --check
      - name: Commit only regenerated feature-branch files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/n8n/marketing/build_workflows.py automation/n8n/marketing/workflows.json tests/marketing_workflows.test.cjs
          git diff --cached --check
          git commit -m 'Fix n8n JSON response handling while retaining exact-body HMAC checks'
          git push origin HEAD:refs/heads/feat/marketing-specialist-runtime-20261004
