name: Production smoke checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE_URL: https://drop-rate-api-live-production.up.railway.app
    steps:
      - name: Verify live and ready endpoints
        shell: bash
        run: |
          set -euo pipefail

          live_status=""
          for attempt in {1..30}; do
            live_status="$(curl --silent --show-error --output live.json --write-out "%{http_code}" "$BASE_URL/health/live" || true)"
            if [ "$live_status" = "200" ]; then
              break
            fi
            sleep 10
          done
          test "$live_status" = "200"
          ready_status="$(curl --silent --show-error --output ready.json --write-out "%{http_code}" "$BASE_URL/health/ready")"
          test "$ready_status" = "200"

      - name: Verify founder dashboard and public configuration
        shell: bash
        run: |
          set -euo pipefail
          dashboard_status="$(curl --silent --show-error --output dashboard.html --write-out "%{http_code}" "$BASE_URL/")"
          test "$dashboard_status" = "200"
          grep --quiet "Founder sign in" dashboard.html

          config_status="$(curl --silent --show-error --output config.json --write-out "%{http_code}" "$BASE_URL/api/v1/public-config")"
          test "$config_status" = "200"
          jq -e '.supabase_url == "https://ozrxenrdladkooixutmm.supabase.co"' config.json
          jq -e '.publishable_key | startswith("sb_publishable_")' config.json
          ! grep --quiet --ignore-case "service_role\|postgresql://" config.json

      - name: Verify inventory requires authentication
        shell: bash
        run: |
          set -euo pipefail
          protected_status="$(curl --silent --show-error --output protected.json --write-out "%{http_code}" "$BASE_URL/api/v1/inventory")"
          test "$protected_status" = "401"
