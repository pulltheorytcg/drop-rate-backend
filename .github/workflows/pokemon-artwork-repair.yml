name: Pokemon artwork repair persistence
on:
  pull_request:
    paths:
      - 'backend/app/pokemon_artwork_repair.py'
      - 'backend/data/pokemon_artwork_m1s_*.json'
      - 'backend/scripts/repair_pokemon_artwork.py'
      - 'backend/app/reference_library.py'
      - 'tests/*pokemon_artwork*'
      - 'tests/test_reference_library.py'
      - 'backend/app/catalogue_browser.py'
      - 'tests/catalogue_price_sources_postgres.py'
      - '.github/workflows/pokemon-artwork-repair.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: pokemon_artwork_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - run: PYTHONPATH=backend python tests/pokemon_artwork_postgres.py
        env:
          POKEMON_ARTWORK_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/pokemon_artwork_test
      - run: PYTHONPATH=backend python tests/catalogue_price_sources_postgres.py
        env:
          POKEMON_ARTWORK_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/pokemon_artwork_test
