name: Seller inventory persistence
on:
  pull_request:
    paths:
      - 'backend/app/owner_inventory.py'
      - 'backend/app/owner_portal_api.py'
      - 'database/migrations/*inventory_op17_reference_artwork.sql'
      - 'tests/*owner_inventory*'
      - '.github/workflows/owner-inventory.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: inventory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - run: PYTHONPATH=backend python tests/owner_inventory_postgres.py
        env:
          INVENTORY_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/inventory_test
