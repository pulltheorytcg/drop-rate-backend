name: One-shot Fusion World reference evidence (development branch)
on:
  push:
    branches: [fix/jp-fusion-world-cardmarket-coverage-20261013]
    paths: [.github/workflows/fusion-world-region-replay.yml]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned current backend dependencies
        run: pip install -q -r requirements.txt
      - name: Replay strict Japanese Fusion World base matches and public source quotes
        run: |
          PYTHONPATH=backend python - <<'PY'
          import json, urllib.request, re, collections, datetime
          from pathlib import Path
          from app.fusion_world_japanese_market import matched_japanese_products, _booster_identity
          from app.dragon_ball_market import matched_products
          from app.reference_market import _minor
          ROOT="https://downloads.s3.cardmarket.com/productCatalog/"
          data={}
          for suffix in ('productList/products_singles_13.json',
                         'productList/products_nonsingles_13.json',
                         'priceGuide/price_guide_13.json'):
              req=urllib.request.Request(ROOT+suffix,headers={"User-Agent":"DropRate-Reference-Replay/1.0"})
              with urllib.request.urlopen(req,timeout=45) as f: raw=f.read(32000001)
              if len(raw)>32000000:raise ValueError("Unbounded provider file")
              result=json.loads(raw)
              if not isinstance(result,dict) or 'createdAt' not in result:raise ValueError("Invalid source")
              data[suffix]=result
              print('SOURCE',suffix,'published',result['createdAt'])
          refs=json.loads(Path('.github/replay-fixtures/fusion-world-en-jp-base-20261013.json').read_text())
          singles={str(r['idProduct']):r for r in data['productList/products_singles_13.json']['products']}
          packaging={str(r['idProduct']):r for r in data['productList/products_nonsingles_13.json']['products']}
          prices={str(r['idProduct']):r for r in data['priceGuide/price_guide_13.json']['priceGuides']}
          matches=matched_japanese_products(refs,singles,packaging)
          priced={key:x for key,x in matches.items() if
              prices.get(str(x['product']['idProduct']),{}).get('idCategory')==1049
              and _minor(prices.get(str(x['product']['idProduct']),{}).get('trend'))>0}
          english=matched_products(refs,singles,packaging)
          by_code=collections.Counter(key.split(':')[1].split('-')[0] for key in matches)
          by_code_priced=collections.Counter(key.split(':')[1].split('-')[0] for key in priced)
          en_expansions={p['idExpansion'] for p in packaging.values() if
              '[Fusion World]' in p.get('name','') and '(Non-English)' not in p['name']
              and p['name'].endswith('Booster [Fusion World]')}
          for key,x in matches.items():
              ref=next(r for r in refs if r['provider_id']==key and r['language']=='Japanese')
              assert _booster_identity(ref) is not None
              assert ref['set_id'].startswith('584')
              assert x['product']['idExpansion'] not in en_expansions
              assert x['region_marker'] in {'Non-English','Japanese','Asia Region Legal'}
          assert len({x['product']['idProduct'] for x in matches.values()}) == len(matches)
          print('FUSION_REGION_REPLAY','refs',len(refs),'jp_base',sum(r['language']=='Japanese' for r in refs),
                'english_base',sum(r['language']=='English' for r in refs),
                'jp_matches',len(matches),'jp_quoted',len(priced),
                'english_matches_unchanged',len(english))
          print('JP_MATCHES_BY_SET',dict(sorted(by_code.items())))
          print('JP_POSITIVE_QUOTES_BY_SET',dict(sorted(by_code_priced.items())))
          print('EXAMPLES',[(key,x['product']['idProduct'],x['product']['name'],x['product']['idExpansion'])
               for key,x in list(priced.items())[:12]])
          assert len(matches)>=100, 'No useful strict unique product coverage'
          assert len(priced)>=75, 'No useful positive public source evidence'
          PY
