name: Prepare owner intake branch
on:
  push:
    branches: ['fix/owner-immediate-import-20261011']
permissions:
  contents: write
concurrency:
  group: prepare-owner-intake-20261011
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'pulltheorytcg/drop-rate-backend'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: import_intake_test
          PGUSER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: python -m pip install --quiet -r requirements.txt -r requirements-dev.txt
      - name: Apply checked source edits and generate local migration only
        run: |
          python scripts/_prepare_owner_intake.py > "$RUNNER_TEMP/prepare.log" 2>&1 || { tail -60 "$RUNNER_TEMP/prepare.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/prepare.log"
          python scripts/_prepare_owner_intake_followup.py
          python -m compileall -q backend/app
          node --check backend/app/static/owner-imports.js
      - name: Prove restricted-role intake and rollback in disposable PostgreSQL
        run: |
          PYTHONPATH=backend pytest -q tests/test_import_admission.py
          PYTHONPATH=backend python tests/owner_auto_import_postgres.py
        env:
          IMPORT_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/import_intake_test
      - name: Commit only prepared implementation files to this branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=fix/owner-immediate-import-20261011
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git diff --check
          git add backend/app/imports.py backend/app/collectr_snapshot.py backend/app/owner_imports.py backend/app/owner_auto_imports.py backend/app/static/owner.html backend/app/static/owner-imports.js backend/app/static/owner-imports.css tests/test_owner_csv_imports.py tests/owner_auto_import_postgres.py tests/test_import_admission.py BUILD_STATUS.md database/migrations
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire and test immediate owner Draft intake with safe partial review'
          git push origin HEAD:refs/heads/$BRANCH
