name: Immediate owner imports
on:
  pull_request:
    paths:
      - 'backend/app/import*.py'
      - 'backend/app/owner_auto_imports.py'
      - 'backend/app/owner_imports.py'
      - 'backend/app/collectr_snapshot.py'
      - 'backend/app/static/owner-imports*'
      - 'backend/app/static/owner.html'
      - 'database/migrations/*owner_incremental_import_intake.sql'
      - 'database/migrations/*inventory_physical_state*.sql'
      - 'tests/*import*'
      - 'tests/ui/owner-import*'
      - '.github/workflows/owner-auto-import.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: import_intake_test
          PGUSER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      IMPORT_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/import_intake_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -r requirements.txt -r requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q tests/test_import_admission.py tests/test_import_physical_condition.py
      - run: PYTHONPATH=backend python tests/owner_auto_import_postgres.py
      - name: Real JWT/JWKS authenticated HTTP acceptance on the disposable database
        run: PYTHONPATH=backend python tests/owner_import_http_acceptance.py
      - name: Production physical-state guard, legacy preview, graded import and re-export regression
        run: PYTHONPATH=backend python tests/owner_import_physical_state_postgres.py
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium webkit
      - name: Actual-template responsive geometry (local fixtures, not live login)
        run: python tests/ui/owner-import-layout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-import-layout
          path: /tmp/drop-rate-import-layout
