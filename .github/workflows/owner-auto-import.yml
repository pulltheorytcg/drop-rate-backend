name: Immediate owner imports
on:
  pull_request:
    paths:
      - 'backend/app/import*.py'
      - 'backend/app/owner_auto_imports.py'
      - 'backend/app/owner_imports.py'
      - 'backend/app/collectr_snapshot.py'
      - 'backend/app/static/owner-imports*'
      - 'database/migrations/*owner_incremental_import_intake.sql'
      - 'tests/*import*'
      - '.github/workflows/owner-auto-import.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: import_intake_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q tests/test_import_admission.py
      - run: PYTHONPATH=backend python tests/owner_auto_import_postgres.py
        env:
          IMPORT_TEST_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/import_intake_test
