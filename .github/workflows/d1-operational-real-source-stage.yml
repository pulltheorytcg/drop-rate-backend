name: Protected REAL Supabase to private operational D1 shadow (never live)
on:
  pull_request:
    paths:
      - 'tools/d1_operational_source_stage.py'
      - 'tools/d1_operational_snapshot_replay.py'
      - 'database/cloudflare_d1/0002_operational_shadow_replay.sql'
      - 'tests/test_d1_operational_source_stage.py'
      - 'tests/test_d1_operational_snapshot_replay.py'
      - 'tests/test_d1_operational_snapshot_schedule.py'
      - '.github/workflows/d1-operational-real-source-stage.yml'
  push:
    branches: ['main']
    paths:
      - 'tools/d1_operational_source_stage.py'
      - 'tools/d1_operational_snapshot_replay.py'
      - 'database/cloudflare_d1/0002_operational_shadow_replay.sql'
      - '.github/workflows/d1-operational-real-source-stage.yml'
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-operational-d1-real-source-single-writer
  cancel-in-progress: false

jobs:
  offline-shadow-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate no source writes, foreign-key lineage, owner/penny parity and no public cutover
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q tests/test_d1_operational_snapshot_replay.py tests/test_d1_operational_snapshot_schedule.py tests/test_d1_operational_source_stage.py tests/test_d1_operational_source_delta_watch.py tests/test_d1_operational_shadow.py tests/test_cloudflare_full_exit_preflight.py

  stage-real-private-d1:
    # Development/merge/scheduling cannot authorise a private D1 write. Approval
    # must identify the exact immutable commit AND workflow run. Read-only drift
    # monitoring remains separately scheduled and is unchanged.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && vars.DR_D1_OPERATIONAL_STAGE_APPROVED_SHA == github.sha
      && vars.DR_D1_OPERATIONAL_STAGE_APPROVED_RUN_ID == github.run_id
    needs: offline-shadow-parity
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production
    permissions:
      contents: read
      statuses: write
    env:
      SUPABASE_PROJECT_ID: ozrxenrdladkooixutmm
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: e4d4b363540e991048d2e1812d5ef53e
      CLOUDFARE_D1_PILOT_TOKEN: ${{ secrets.CLOUDFARE_D1_PILOT_TOKEN }}
      PYTHONPATH: backend:tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install asyncpg==0.30.0
      - name: Prepare masked existing privileged postgres connection (READ-ONLY transaction)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import quote
          pw=os.environ.get('SUPABASE_DB_PASSWORD','')
          project=os.environ['SUPABASE_PROJECT_ID']
          if not pw or any(c in pw for c in '\r\n'):
              raise SystemExit('Protected PostgreSQL credential missing/invalid')
          encoded=quote(pw,safe='')
          dsn=(f'postgresql://postgres.{project}:{encoded}'
               '@aws-0-eu-west-2.pooler.supabase.com:5432/postgres?sslmode=require')
          for x in (encoded,dsn):
              print('::add-mask::'+x.replace('%','%25'),flush=True)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as f:
              f.write('FULL_EXIT_PG_READONLY_DSN='+dsn+'\n')
          PY
      - name: Replay classified inventory differences into a new immutable shadow generation
        id: stage
        run: |
          set -euo pipefail
          python tools/d1_operational_snapshot_replay.py --apply > d1-operational-source-stage-receipt.json
          python - <<'PYCODE'
          import json
          r=json.load(open('d1-operational-source-stage-receipt.json'))
          assert r['status'] in {
              'INVENTORY_REPLAY_SNAPSHOT_PARITY_VERIFIED',
              'INVENTORY_REPLAY_ALREADY_VERIFIED',
              'INVENTORY_REPLAY_DEFERRED_DAILY_BUDGET'}
          assert r['unexplained_differences']==0
          assert r['source_postgres_writes']==0
          assert r['production_reads_switched'] is False
          assert r['financial_authority_changed'] is False
          assert r['payment_or_settlement_executed'] is False
          assert r['supabase_source_retired'] is False
          print(r['status'])
          PYCODE
      - name: Independently recapture production and check drift after replay
        if: steps.stage.outcome == 'success'
        run: |
          python tools/d1_operational_source_delta_watch.py --explain-drift > d1-operational-after-replay.json
      - name: Attach count-only replay and independent verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-operational-shadow-replay-receipts
          path: |
            d1-operational-source-stage-receipt.json
            d1-operational-after-replay.json
          retention-days: 30
