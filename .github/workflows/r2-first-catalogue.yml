name: R2-first catalogue safety

on:
  pull_request:
    paths:
      - 'backend/app/r2_first_*.py'
      - 'backend/scripts/*r2_first*.py'
      - 'backend/app/catalogue_browser.py'
      - 'backend/app/catalogue_saved.py'
      - 'backend/app/access_control.py'
      - 'backend/app/db.py'
      - 'backend/app/inventory_intake.py'
      - 'database/migrations/20261103222018_r2_first_catalogue_registry.sql'
      - 'database/migrations/20261103143718_catalogue_saved_references.sql'
      - 'tests/test_r2_first_*.py'
      - 'tests/r2_first_postgres.py'
      - '.github/workflows/r2-first-catalogue.yml'
  push:
    paths:
      - 'backend/app/r2_first_*.py'
      - 'backend/scripts/*r2_first*.py'
      - 'backend/app/catalogue_browser.py'
      - 'backend/app/catalogue_saved.py'
      - 'backend/app/access_control.py'
      - 'backend/app/db.py'
      - 'backend/app/inventory_intake.py'
      - 'database/migrations/20261103222018_r2_first_catalogue_registry.sql'
      - 'database/migrations/20261103143718_catalogue_saved_references.sql'
      - 'tests/test_r2_first_*.py'
      - 'tests/r2_first_postgres.py'
      - '.github/workflows/r2-first-catalogue.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-first-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-r2-first-only
          POSTGRES_DB: r2_first_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d r2_first_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - name: Closed metadata, integrity, bounded reads and legacy-route regressions
        run: PYTHONPATH=backend python -m pytest -q tests/test_r2_first_*.py tests/test_catalogue_browser.py tests/test_catalogue_browser_connection_retry.py
      - name: PostgreSQL 17 publication, owner RLS, audit and retry proof
        run: PYTHONPATH=backend python tests/r2_first_postgres.py
        env:
          R2_FIRST_TEST_DSN: postgresql://postgres:disposable-r2-first-only@127.0.0.1:5432/r2_first_test
