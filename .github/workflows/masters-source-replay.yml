name: Temporary English Masters market source replay
on:
  push:
    branches: [feat/market-batch-03-masters-catalogue-20261013]
    paths: [.github/workflows/masters-source-replay.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -q
      - name: Compare public first-party market products with official Masters checklist
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import datetime, timezone
          from decimal import Decimal, ROUND_HALF_UP
          import json,urllib.request
          from pathlib import Path
          from app.dragon_ball_masters_missing_market import (
              RELEASES, exact_masters_supplemental_matches, supplemental_coverage)
          from app.reference_market import _minor
          base="https://downloads.s3.cardmarket.com/productCatalog/"
          def download(path,rows_key):
              req=urllib.request.Request(base+path,headers={"User-Agent":"DropRate-ReadOnly-Source-Replay/1.0"})
              with urllib.request.urlopen(req,timeout=35) as handle:
                  raw=handle.read(32000001)
              if len(raw)>32000000:raise ValueError("Source unexpectedly large")
              document=json.loads(raw)
              if not isinstance(document.get("createdAt"),str) or not isinstance(document.get(rows_key),list):
                  raise ValueError("Malformed source document")
              print("PUBLIC_SOURCE",path,document["createdAt"],"rows",len(document[rows_key]))
              return {str(x["idProduct"]):x for x in document[rows_key]}
          singles=download("productList/products_singles_13.json","products")
          packs=download("productList/products_nonsingles_13.json","products")
          guides=download("priceGuide/price_guide_13.json","priceGuides")
          refs=json.loads(Path(".github/masters_english_official_refs_replay.json").read_text())
          matches=exact_masters_supplemental_matches(refs,singles,packs)
          coverage=supplemental_coverage(refs,matches,guides)
          total=priced=0
          for set_id,item in RELEASES.items():
              c=coverage[set_id]
              def eligible_source_quote(p):
                  guide=guides.get(str(p["idProduct"]))
                  if not guide or guide.get("idCategory")!=1049:return False
                  try:
                      euro=_minor(guide.get("trend"))
                      gbp=int((Decimal(euro)*Decimal(".85")).quantize(Decimal("1"),rounding=ROUND_HALF_UP))
                      return euro>0 and gbp>0
                  except (ValueError,TypeError,ArithmeticError):
                      return False
              valid=sum(
                  1 for key,p in matches.items() if key[1].startswith(set_id+":")
                  and eligible_source_quote(p)
              )
              c["valid_priced_estimate"]=valid
              total+=c["checked"];priced+=valid
              print("REAL_RELEASE",set_id,item[0],json.dumps(c,sort_keys=True))
          print("TOTAL_PUBLIC_REPLAY",json.dumps({"checked":total,"unique_market_matches":len(matches),"positive_priced_candidates":priced},sort_keys=True))
          print("SAMPLES",[(k[1],v["name"],v["idProduct"],v["idExpansion"]) for k,v in list(matches.items())[:14]])
          assert total==902
          assert priced>100, "No meaningful safe recovery; fail workbench"
          assert len({v["idProduct"] for v in matches.values()})==len(matches)
          PY
